<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explora lugares escondidos de Medellín con fotos, descripciones y cómo llegar.">
  <title>Explorar | Medellín Secreta</title>
  <link rel="stylesheet" href="../css/tailwind.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 antialiased" data-raiz="../" data-pagina="explorar">
  <header id="encabezado"></header><!-- lo llena app.js -->
  <main class="mx-auto max-w-7xl px-6 py-10">
    <h1 class="mb-2 text-3xl font-bold text-green-900">Explora Medellín</h1>
    <p class="mb-6 text-gray-600">Medellín tiene lugares que todavía no conoces. Descubre sitios para visitar y encuentra tu próximo plan.</p>
    <label for="buscador" class="mb-1 block font-bold text-green-900">Buscar un lugar</label>
    <input id="buscador" type="search" placeholder="Escribe el nombre de un lugar" class="mb-4 w-full rounded-lg border-2 border-gray-300 bg-white px-4 py-3 focus:border-green-700 focus:outline-none focus:ring-4 focus:ring-green-200"><!-- buscador (HU-05) -->
    <div id="filtros" class="mb-4 flex flex-wrap gap-2" role="group" aria-label="Filtrar por categoría"></div><!-- chips: los pinta app.js -->
    <p id="contador" class="mb-6 text-sm font-semibold text-gray-500" aria-live="polite"></p><!-- "N lugares" -->
    <section id="catalogo" class="grid gap-8 md:grid-cols-2 lg:grid-cols-3"></section><!-- tarjetas -->
    <p id="sinResultados" class="hidden py-10 text-center text-gray-500">No encontramos lugares con ese criterio. Prueba otra búsqueda o categoría.</p>
  </main>
  <!-- Ventana emergente: <dialog> nativo; app.js la llena y la abre -->
  <dialog id="modal" class="m-auto w-[92%] max-w-lg overflow-hidden rounded-2xl p-0 shadow-2xl backdrop:bg-black/60"></dialog>
  <footer id="pie"></footer>
  <script src="../js/datos.js"></script><!-- primero los datos -->
  <script src="../js/app.js"></script><!-- luego la lógica -->
</body>
</html>
